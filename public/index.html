<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1e1e1e">
  <title>Scan Part · Gudang Sparepart</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/camera.css">
</head>
<body class="camera-page" data-mode="check">
  <main class="camera" id="camera">
    <video id="video" playsinline muted></video>
    <div class="cam-shade" aria-hidden="true"></div>

    <header class="cam-top">
      <button id="torch" class="cam-icon" type="button" aria-pressed="false" aria-label="Nyalakan flash" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 3 5 14h6l-1 7 8-11h-6z"/></svg>
      </button>
      <span class="cam-title">Gudang Sparepart</span>
      <button id="switch-camera" class="cam-icon" type="button" aria-label="Ganti kamera" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><path d="M9.5 13a2.5 2.5 0 0 1 4.6-1.3M14.5 13a2.5 2.5 0 0 1-4.6 1.3"/></svg>
      </button>
    </header>

    <div id="frame" class="scan-frame" aria-hidden="true"></div>
    <p id="scan-hint" class="scan-hint" aria-live="polite">Menyalakan kamera…</p>
    <p id="toast" class="toast" role="status" hidden></p>
    <p id="camera-msg" class="camera-msg" hidden></p>

    <footer class="cam-bottom">
      <div id="zoom-chips" class="zoom-chips" role="group" aria-label="Zoom" hidden></div>
      <div id="modes" class="modes" role="group" aria-label="Mode scan">
        <button type="button" data-mode="check" aria-pressed="true">CEK</button>
        <button type="button" data-mode="in" aria-pressed="false">MASUK</button>
        <button type="button" data-mode="out" aria-pressed="false">KELUAR</button>
      </div>
      <nav class="cam-actions" aria-label="Menu">
        <a class="cam-icon cam-icon-lg" href="/history.html" aria-label="Riwayat">
          <span id="last-stock" class="last-stock" hidden></span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>
        </a>
        <button id="open-manual" class="shutter" type="button" aria-label="Ketik barcode">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M7 10h1M11 10h1M15 10h1M8 14h8"/></svg>
        </button>
        <a class="cam-icon cam-icon-lg" href="/parts.html" aria-label="Daftar part">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M4 6h1M4 12h1M4 18h1"/></svg>
        </a>
      </nav>
    </footer>
  </main>

  <div id="backdrop" class="backdrop" hidden></div>

  <section id="sheet" class="sheet" aria-label="Info part" hidden>
    <div id="sheet-grab" class="sheet-grab" aria-hidden="true"><span></span></div>
    <p id="status" hidden></p>

    <div id="view-manual" hidden>
      <form id="manual-form" class="row" autocomplete="off">
        <div class="field">
          <label for="manual-barcode">Ketik barcode</label>
          <input id="manual-barcode" inputmode="numeric" maxlength="64" required>
        </div>
        <button class="btn btn-primary" type="submit">Cari</button>
      </form>
    </div>

    <div id="view-part" hidden>
      <div id="r-part-number" class="part-number"></div>
      <div id="r-name" class="part-name"></div>
      <div id="r-description" class="muted"></div>
      <div class="muted mono">Barcode: <span id="r-barcode"></span></div>
      <div class="sheet-row">
        <span class="price" id="r-price"></span>
        <span class="stock">Stok: <b id="r-stock"></b></span>
      </div>
      <div class="sheet-row">
        <div id="quick-actions" class="quick-actions">
          <button type="button" class="btn" data-quick="in">Catat masuk</button>
          <button type="button" class="btn" data-quick="out">Catat keluar</button>
        </div>
      </div>

      <form id="move-form" autocomplete="off" hidden>
        <div class="sheet-row">
          <label for="move-qty" class="muted">Jumlah</label>
          <div class="stepper">
            <button type="button" id="qty-minus" aria-label="Kurangi jumlah">−</button>
            <input id="move-qty" inputmode="numeric" value="1" required>
            <button type="button" id="qty-plus" aria-label="Tambah jumlah">+</button>
          </div>
        </div>
        <div class="field">
          <label for="move-note">Catatan (opsional)</label>
          <input id="move-note" maxlength="200">
        </div>
        <button id="move-submit" class="btn btn-block" type="submit"></button>
      </form>
    </div>

    <div id="view-register" hidden>
      <p class="msg-error" style="margin:0">Barcode belum terdaftar</p>
      <h2 class="sheet-title">Daftarkan part</h2>
      <form id="register-form" autocomplete="off" class="stack">
        <p class="req-note"><span class="req" aria-hidden="true">*</span> wajib diisi</p>
        <div class="field">
          <label for="reg-barcode">Barcode</label>
          <input id="reg-barcode" readonly>
        </div>
        <div class="field">
          <label for="reg-part-number">Part number <span class="req" aria-hidden="true">*</span></label>
          <input id="reg-part-number" maxlength="64" required placeholder="04465-0K240">
        </div>
        <div class="field">
          <label for="reg-name">Nama barang <span class="req" aria-hidden="true">*</span></label>
          <input id="reg-name" maxlength="200" required placeholder="Kampas rem depan">
        </div>
        <div class="field">
          <label for="reg-price">Harga <span class="req" aria-hidden="true">*</span></label>
          <input id="reg-price" inputmode="numeric" required placeholder="450.000">
        </div>
        <div class="field">
          <label for="reg-description">Deskripsi <span class="opt">(opsional)</span></label>
          <textarea id="reg-description" maxlength="500" rows="2" placeholder="Untuk Innova Reborn"></textarea>
        </div>
        <button id="reg-submit" class="btn btn-primary btn-block" type="submit">Simpan part</button>
      </form>
    </div>

    <button id="sheet-close" class="sheet-close" type="button">Batal, scan lagi</button>
  </section>

  <script src="/vendor/barcode-detector.js"></script>
  <script type="module" src="/js/scan.js"></script>
</body>
</html>
